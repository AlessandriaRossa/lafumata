{{ define "main" }}

<style>

.article-container {
  max-width: 900px;
  margin: 90px auto 40px auto;
  padding: 0 20px;
  font-family: system-ui, Arial, sans-serif;
}

.article-header {
  margin-bottom: 30px;
 
}

.article-title {
  font-size: 2.3rem;
  margin: 0 0 10px;
}

.article-items {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 28px;
}

.article-item {
    display: block;
    width: 100%;
    padding: 22px 30px;
    border: 2px solid #9b3c3c;
    text-decoration: none;
    background: #fff;
    transition: background 0.15s ease;
}

.article-item:hover {
  background: #f0f0f0;
  border-color: #ccc;
}

.article-item-title {
  font-size: 1.4rem;
 
  text-decoration: none;
  font-weight: 600;
}

.article-item-title:hover {
  text-decoration: underline;
}

.article-meta {
 
  font-size: 0.9rem;
  margin: 4px 0 10px 0;
}

.article-summary {
  font-size: 1.05rem;
  line-height: 1.55;
  margin: 0 0 10px 0;
 
}

</style>

<main class="article-container">

  <header class="article-header">
    <h1 class="article-title">{{ .Title }}</h1>
  </header>

  <section class="article-items">

    {{ .Content }}
    {{ range .Pages }}
      <article class="article-item">
        
        <a class="article-item-title" href="{{ .RelPermalink }}">
          {{ .Title }}
        </a>

        <p class="article-summary">
          {{ if .Summary }}
            {{ .Summary }}
          {{ end }}
        </p>

      </article>
    {{ end }}

  </section>

</main>

{{ end }}
