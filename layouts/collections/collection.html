{{ define "main" }}

<style>

.collection-container {
  max-width: 700px;
  margin: 90px auto 40px auto;
  padding: 0 20px;
  font-family: system-ui, Arial, sans-serif;
  text-align: center;
}

.collection-title {
  font-size: 2rem;
  font-weight: 700;
 
  margin-bottom: 40px;
}

.collection-cards {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 28px;
}

.collection-card {
  display: block;
  width: 100%;
  padding: 22px 30px;
  border: 2px solid #9b3c3c;
  text-decoration: none;
  background: #fff;
  transition: background 0.15s ease;
}

.collection-card:hover {
  background: #fff5f5;
}

.collection-card-title {
  font-family: 'Caveat', cursive;
  font-size: 2rem;
 
  display: block;
}

</style>

<main class="collection-container">

  <h1 class="collection-title">{{ .Title }}</h1>

  <div class="collection-cards">

	  {{ range .Sections }}
	  <a class="collection-card" href="{{ .RelPermalink }}">
		<span class="collection-card-title">{{ .Title }}</span>
	  </a>
	{{ end }}
  </div>

</main>

{{ end }}
